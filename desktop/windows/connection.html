<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Подключение к Kosmora</title>
    <link rel="stylesheet" href="./connection.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-labelledby="title">
        <div class="brand">
          <div class="mark" aria-hidden="true"><img src="./build/icon.svg" alt="" /></div>
          <p class="eyebrow">Kosmora <span>для Windows</span></p>
        </div>
        <h1 id="title">Подключение к Kosmora</h1>
        <p id="lead" class="lead"></p>

        <form id="connection-form" autocomplete="off">
          <label>
            Адрес сервера
            <input
              id="origin"
              name="origin"
              type="url"
              inputmode="url"
              spellcheck="false"
              required
              placeholder="https://13.141.51.16"
            />
          </label>

          <p id="error" class="error" role="alert" aria-live="assertive"></p>
          <button id="connect" type="submit">Открыть Kosmora</button>
        </form>

        <div class="recovery-actions">
          <button id="retry" type="button" hidden>Повторить</button>
          <button id="change" class="secondary" type="button" hidden>Сменить адрес</button>
        </div>

        <p class="hint">После подключения войдите в своё рабочее пространство.</p>
      </section>
    </main>
    <script src="./connection.js"></script>
  </body>
</html>
