<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Kosmora — Загрузки</title>
    <link href="downloads.css" rel="stylesheet" />
    <script src="downloads.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Загрузки</h1>
          <p>Файлы не запускаются автоматически. Ссылки скачивания не сохраняются.</p>
        </div>
        <button id="clear" type="button">Очистить завершённые</button>
      </header>
      <p id="message" role="status" aria-live="polite"></p>
      <ol id="downloads" aria-label="История загрузок"></ol>
      <p id="empty" hidden>Пока нет загрузок.</p>
    </main>
  </body>
</html>
