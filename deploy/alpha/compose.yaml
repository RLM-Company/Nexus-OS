services:
  api:
    image: cosmora-alpha-app:local
    build:
      context: ../..
      dockerfile: deploy/alpha/Dockerfile
    restart: unless-stopped
    command: pnpm --filter @cosmora/api start
    healthcheck:
      test: ["CMD", "node", "deploy/alpha/healthcheck.mjs", "api"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    env_file:
      - path: ./private/model.env
        format: raw
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3100
      DATABASE_URL: file:/var/lib/cosmora/cosmora.db
      WEB_ORIGIN: https://${COSMORA_DEMO_DOMAIN:?Set COSMORA_DEMO_DOMAIN}
      KOSMORA_REGISTRATION_ENABLED: ${KOSMORA_REGISTRATION_ENABLED:-0}
      KOSMORA_GOOGLE_CLIENT_ID: ${KOSMORA_GOOGLE_CLIENT_ID:-}
      KOSMORA_GOOGLE_CLIENT_SECRET: ${KOSMORA_GOOGLE_CLIENT_SECRET:-}
      KOSMORA_SENDMAIL_PATH: ${KOSMORA_SENDMAIL_PATH:-}
      KOSMORA_EMAIL_FROM: ${KOSMORA_EMAIL_FROM:-}
    volumes:
      - cosmora_data:/var/lib/cosmora
    networks: [internal]

  web:
    image: cosmora-alpha-app:local
    restart: unless-stopped
    command: pnpm --filter @cosmora/web exec next start -H 0.0.0.0 -p 3000
    healthcheck:
      test: ["CMD", "node", "deploy/alpha/healthcheck.mjs", "web"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      NODE_ENV: production
    networks: [internal]

  owner-access:
    image: cosmora-alpha-app:local
    restart: unless-stopped
    command: node /run/owner-login/owner-access.mjs
    env_file:
      - path: ./private/owner-login.env
        format: raw
    environment:
      COSMORA_DEMO_DOMAIN: ${COSMORA_DEMO_DOMAIN:?Set COSMORA_DEMO_DOMAIN}
      COSMORA_OWNER_SESSION_FILE: /var/lib/cosmora-owner/sessions.json
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [internal]
    mem_limit: 192m
    cpus: 0.5
    volumes:
      - ./owner-access.mjs:/run/owner-login/owner-access.mjs:ro
      - ./owner-session-store.mjs:/run/owner-login/owner-session-store.mjs:ro
      - owner_sessions:/var/lib/cosmora-owner

  edge:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      owner-access:
        condition: service_healthy
    env_file:
      - path: ./private/site.env
        format: raw
      - path: ./private/owner-session.env
        format: raw
        required: false
    environment:
      COSMORA_AUTH_ROUTE_FILE: ${COSMORA_AUTH_ROUTE_FILE:-owner-routes.caddy}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./owner-routes.caddy:/etc/caddy/owner-routes.caddy:ro
      - ./registration-routes.caddy:/etc/caddy/registration-routes.caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

networks:
  internal:

volumes:
  owner_sessions:
  cosmora_data:
  caddy_data:
  caddy_config:
