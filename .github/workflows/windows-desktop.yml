name: Windows desktop

on:
  pull_request:
    paths:
      - "desktop/windows/**"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and lifecycle-test NSIS installer
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check out upgrade baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          # Last verified Windows 0.8.0 lifecycle, before the form-login migration.
          ref: 266c1868f8e69e2a9fa08f346ebd6e37067d08a2
          path: upgrade-baseline

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Prepare pinned offline PDF and OCR assets
        shell: pwsh
        run: |
          npm ci --ignore-scripts --omit=optional --prefix desktop/windows/document-reader/deps
          if ($LASTEXITCODE -ne 0) { throw "Document asset dependency install failed." }
          node desktop/windows/document-reader/prepare.cjs
          if ($LASTEXITCODE -ne 0) { throw "Document asset preparation failed." }

      - name: Syntax and policy checks
        working-directory: desktop/windows
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { throw "Desktop checks failed." }
          npm run verify:unsigned
          if ($LASTEXITCODE -ne 0) { throw "Unsigned distribution policy failed." }
          # Compile the helper and test pure INPUT builders under PowerShell 5.
          # Closed stdin: no desktop inspection, input or application launch.
          node -e "require('node:child_process').execFileSync(process.env.SystemRoot + '/System32/WindowsPowerShell/v1.0/powershell.exe', ['-NoLogo', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', 'ci/check-computer-helper.ps1'], { input: '', stdio: ['pipe', 'inherit', 'inherit'], timeout: 30000 })"
          if ($LASTEXITCODE -ne 0) { throw "Computer helper offline checks failed." }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "ci/nsis-lifecycle.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "NSIS lifecycle PowerShell syntax validation failed."
          }

      - name: Build unsigned Windows installer
        working-directory: desktop/windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --yes electron-builder@26.17.0 --win nsis --x64 --publish never

      - name: Build upgrade baseline installer
        if: github.event_name == 'pull_request'
        working-directory: upgrade-baseline/desktop/windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --yes electron-builder@26.17.0 --win nsis --x64 --publish never

      - name: Verify fresh installer lifecycle and packaged GUI
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/windows/package.json').version"
          ./desktop/windows/ci/nsis-lifecycle.ps1 `
            -Mode Fresh `
            -CurrentInstaller "desktop/windows/dist/Kosmora-Setup-$version-x64.exe" `
            -CurrentVersion $version `
            -WorkRoot (Join-Path $env:RUNNER_TEMP "cosmora-fresh-lifecycle")

      - name: Verify upgrade and uninstall preserve user data
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $currentVersion = node -p "require('./desktop/windows/package.json').version"
          $baselineVersion = node -p "require('./upgrade-baseline/desktop/windows/package.json').version"
          ./desktop/windows/ci/nsis-lifecycle.ps1 `
            -Mode Upgrade `
            -CurrentInstaller "desktop/windows/dist/Kosmora-Setup-$currentVersion-x64.exe" `
            -CurrentVersion $currentVersion `
            -BaselineInstaller "upgrade-baseline/desktop/windows/dist/Cosmora-Setup-$baselineVersion-x64.exe" `
            -WorkRoot (Join-Path $env:RUNNER_TEMP "cosmora-upgrade-lifecycle")

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/windows/package.json').version"
          $installer = "desktop/windows/dist/Kosmora-Setup-$version-x64.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Expected installer was not produced: $installer"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          Write-Host "Installer: $installer"
          Write-Host "SHA-256: $hash"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: kosmora-windows-x64
          path: desktop/windows/dist/Kosmora-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaged GUI acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosmora-windows-gui-acceptance
          path: ${{ runner.temp }}/cosmora-gui-acceptance-report.json
          if-no-files-found: ignore
          retention-days: 14

  live-smoke:
    name: Live server acceptance smoke
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    # Opt-in only (LIVE_ACCEPTANCE_PLAN_RU.md): until the owner creates the
    # KOSMORA_LIVE_ORIGIN secret the job stays a visible no-op. The origin is
    # used in-memory only; the packaged app re-validates the double opt-in
    # (remoteOrigin config flag + env gate) and refuses loopback origins.
    env:
      KOSMORA_LIVE_ORIGIN: ${{ secrets.KOSMORA_LIVE_ORIGIN }}
    steps:
      - name: Report live origin gate
        if: env.KOSMORA_LIVE_ORIGIN == ''
        run: >-
          Write-Host
          "KOSMORA_LIVE_ORIGIN secret is not set; live server acceptance smoke is skipped."

      - name: Check out repository
        if: env.KOSMORA_LIVE_ORIGIN != ''
        uses: actions/checkout@v5

      - name: Set up Node.js
        if: env.KOSMORA_LIVE_ORIGIN != ''
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download installer artifact
        if: env.KOSMORA_LIVE_ORIGIN != ''
        uses: actions/download-artifact@v4
        with:
          name: kosmora-windows-x64
          path: desktop/windows/dist

      - name: Install unsigned installer
        if: env.KOSMORA_LIVE_ORIGIN != ''
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath "desktop/windows/dist" -Filter "Kosmora-Setup-*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "Installer artifact was not found." }
          $installDir = Join-Path $env:RUNNER_TEMP "cosmora-live-smoke\install"
          if (Test-Path -LiteralPath $installDir) { throw "Live smoke install directory must be new." }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS install failed with exit code $($process.ExitCode)." }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir "Kosmora.exe") -PathType Leaf)) {
            throw "Installed Kosmora.exe was not found."
          }

      - name: Run live acceptance smoke
        if: env.KOSMORA_LIVE_ORIGIN != ''
        working-directory: desktop/windows
        shell: pwsh
        env:
          KOSMORA_GUI_ACCEPTANCE_ALLOW_REMOTE_ORIGIN: "1"
        run: |
          $app = Join-Path $env:RUNNER_TEMP "cosmora-live-smoke\install\Kosmora.exe"
          $workRoot = Join-Path $env:RUNNER_TEMP "cosmora-live-smoke"
          node ci/gui-acceptance-live.cjs --app $app --work-root $workRoot
          if ($LASTEXITCODE -ne 0) { throw "Live acceptance smoke failed." }

      - name: Uninstall live smoke install
        if: always() && env.KOSMORA_LIVE_ORIGIN != ''
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "cosmora-live-smoke\install"
          $uninstaller = Get-ChildItem -LiteralPath $installDir -Filter "Uninstall*.exe" -File | Select-Object -First 1
          if (-not $uninstaller) { throw "NSIS uninstaller was not found." }
          $process = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS uninstall failed with exit code $($process.ExitCode)." }

      - name: Upload live acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosmora-windows-gui-acceptance-live
          path: ${{ runner.temp }}/cosmora-gui-acceptance-live-report.json
          if-no-files-found: ignore
          retention-days: 14
