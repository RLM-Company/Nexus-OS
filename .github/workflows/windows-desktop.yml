name: Windows desktop

on:
  pull_request:
    paths:
      - "desktop/windows/**"
      - "apps/web/**"
      - ".github/workflows/windows-desktop.yml"
      - ".github/workflows/windows-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lifecycle-test NSIS installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check out upgrade baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: upgrade-baseline

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate desktop syntax
        shell: pwsh
        run: |
          node --check desktop/windows/main.cjs
          node --check desktop/windows/preload.cjs
          node --check desktop/windows/connection-policy.cjs
          node --check desktop/windows/connection-state.cjs
          node --check desktop/windows/credential-store.cjs
          node --check desktop/windows/support-bundle.cjs
          node --check desktop/windows/update-policy.cjs
          node --check desktop/windows/update-download.cjs
          node --check desktop/windows/release-chain.cjs
          node --check desktop/windows/signing-policy.cjs
          node --check desktop/windows/smoke-mode.cjs
          node --check desktop/windows/connection.js
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "desktop/windows/ci/nsis-lifecycle.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "NSIS lifecycle PowerShell syntax validation failed."
          }

      - name: Test desktop policy
        run: node --test desktop/windows/test/*.test.cjs

      - name: Build Windows installer
        working-directory: desktop/windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --yes electron-builder@26.17.0 --win nsis --x64 --publish never

      - name: Build upgrade baseline installer
        if: github.event_name == 'pull_request'
        working-directory: upgrade-baseline/desktop/windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --yes electron-builder@26.17.0 --win nsis --x64 --publish never

      - name: Test fresh installer lifecycle
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/windows/package.json').version"
          $installer = "desktop/windows/dist/Cosmora-Setup-$version-x64.exe"
          ./desktop/windows/ci/nsis-lifecycle.ps1 `
            -Mode Fresh `
            -CurrentInstaller $installer `
            -CurrentVersion $version `
            -WorkRoot (Join-Path $env:RUNNER_TEMP "cosmora-fresh-lifecycle")

      - name: Test upgrade lifecycle and persisted user data
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $currentVersion = node -p "require('./desktop/windows/package.json').version"
          $baselineVersion = node -p "require('./upgrade-baseline/desktop/windows/package.json').version"
          if ($baselineVersion -eq $currentVersion) {
            throw "Pull-request base version must differ from current desktop version for upgrade testing."
          }

          $currentInstaller = "desktop/windows/dist/Cosmora-Setup-$currentVersion-x64.exe"
          $baselineInstaller = "upgrade-baseline/desktop/windows/dist/Cosmora-Setup-$baselineVersion-x64.exe"

          ./desktop/windows/ci/nsis-lifecycle.ps1 `
            -Mode Upgrade `
            -CurrentInstaller $currentInstaller `
            -CurrentVersion $currentVersion `
            -BaselineInstaller $baselineInstaller `
            -BaselineVersion $baselineVersion `
            -WorkRoot (Join-Path $env:RUNNER_TEMP "cosmora-upgrade-lifecycle")

      - name: Build and verify release bundle
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/windows/package.json').version"
          $installer = "desktop/windows/dist/Cosmora-Setup-$version-x64.exe"
          node desktop/windows/release-chain.cjs bundle --installer $installer --package desktop/windows/package.json --output desktop/windows/dist/release --git-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          node desktop/windows/release-chain.cjs verify --installer $installer --metadata desktop/windows/dist/release/release-metadata.json

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cosmora-windows-x64
          path: |
            desktop/windows/dist/Cosmora-Setup-*.exe
            desktop/windows/dist/Cosmora-Setup-*.exe.blockmap
            desktop/windows/dist/release/release-metadata.json
            desktop/windows/dist/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
