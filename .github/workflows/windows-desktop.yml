name: Windows desktop

on:
  pull_request:
    paths:
      - "desktop/windows/**"
      - "apps/web/**"
      - ".github/workflows/windows-desktop.yml"
      - ".github/workflows/windows-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate desktop syntax
        shell: pwsh
        run: |
          node --check desktop/windows/main.cjs
          node --check desktop/windows/preload.cjs
          node --check desktop/windows/connection-policy.cjs
          node --check desktop/windows/connection-state.cjs
          node --check desktop/windows/credential-store.cjs
          node --check desktop/windows/support-bundle.cjs
          node --check desktop/windows/update-policy.cjs
          node --check desktop/windows/release-chain.cjs
          node --check desktop/windows/signing-policy.cjs
          node --check desktop/windows/smoke-mode.cjs
          node --check desktop/windows/connection.js

      - name: Test desktop policy
        run: node --test desktop/windows/test/*.test.cjs

      - name: Build Windows installer
        working-directory: desktop/windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --yes electron-builder@26.17.0 --win nsis --x64 --publish never

      - name: Smoke test installed NSIS lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = node -p "require('./desktop/windows/package.json').version"
          $installer = (Resolve-Path "desktop/windows/dist/Cosmora-Setup-$version-x64.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "cosmora-installed-$version"
          $marker = Join-Path $env:TEMP "cosmora-smoke-$version.json"

          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $marker -Force -ErrorAction SilentlyContinue

          $install = Start-Process -FilePath $installer -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "NSIS install failed with exit code $($install.ExitCode)."
          }

          $app = Join-Path $installDir "Cosmora.exe"
          if (-not (Test-Path $app -PathType Leaf)) {
            throw "Installed Cosmora.exe was not found at $app."
          }

          $uninstaller = Get-ChildItem -Path $installDir -Filter "Uninstall*.exe" -File |
            Select-Object -First 1
          if (-not $uninstaller) {
            throw "NSIS uninstaller was not found in $installDir."
          }

          $env:COSMORA_SMOKE_OUTPUT = $marker
          try {
            $smoke = Start-Process -FilePath $app -ArgumentList "--cosmora-smoke-test" -Wait -PassThru
          } finally {
            Remove-Item Env:COSMORA_SMOKE_OUTPUT -ErrorAction SilentlyContinue
          }
          if ($smoke.ExitCode -ne 0) {
            throw "Installed Cosmora smoke process failed with exit code $($smoke.ExitCode)."
          }
          if (-not (Test-Path $marker -PathType Leaf)) {
            throw "Installed Cosmora did not produce the smoke marker."
          }

          $record = Get-Content $marker -Raw | ConvertFrom-Json
          if ($record.schemaVersion -ne 1) {
            throw "Unexpected smoke schema version $($record.schemaVersion)."
          }
          if ($record.version -ne $version) {
            throw "Installed version $($record.version) does not match package version $version."
          }
          if ($record.isPackaged -ne $true) {
            throw "Installed Cosmora did not report packaged mode."
          }
          if ($record.platform -ne "win32" -or $record.arch -ne "x64") {
            throw "Installed Cosmora reported an unexpected platform or architecture."
          }

          $expectedExe = [IO.Path]::GetFullPath($app)
          $actualExe = [IO.Path]::GetFullPath([string]$record.execPath)
          if (-not [string]::Equals($expectedExe, $actualExe, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Smoke executable path does not match the installed application."
          }

          $expectedResources = [IO.Path]::GetFullPath((Join-Path $installDir "resources"))
          $actualResources = [IO.Path]::GetFullPath([string]$record.resourcesPath)
          if (-not [string]::Equals($expectedResources, $actualResources, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Smoke resources path does not match the installed application."
          }

          $expectedAsar = [IO.Path]::GetFullPath((Join-Path $expectedResources "app.asar"))
          $actualAppPath = [IO.Path]::GetFullPath([string]$record.appPath)
          if (-not [string]::Equals($expectedAsar, $actualAppPath, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Smoke app path is not the packaged app.asar."
          }

          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "NSIS uninstall failed with exit code $($uninstall.ExitCode)."
          }

          for ($attempt = 0; $attempt -lt 80 -and (Test-Path $installDir); $attempt++) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path $installDir) {
            Get-ChildItem -Path $installDir -Recurse -Force | Select-Object -First 50 | Format-Table -AutoSize
            throw "NSIS uninstall left the installation directory behind."
          }

          Remove-Item $marker -Force -ErrorAction SilentlyContinue

      - name: Build and verify release bundle
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/windows/package.json').version"
          $installer = "desktop/windows/dist/Cosmora-Setup-$version-x64.exe"
          node desktop/windows/release-chain.cjs bundle --installer $installer --package desktop/windows/package.json --output desktop/windows/dist/release --git-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          node desktop/windows/release-chain.cjs verify --installer $installer --metadata desktop/windows/dist/release/release-metadata.json

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cosmora-windows-x64
          path: |
            desktop/windows/dist/Cosmora-Setup-*.exe
            desktop/windows/dist/Cosmora-Setup-*.exe.blockmap
            desktop/windows/dist/release/release-metadata.json
            desktop/windows/dist/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
