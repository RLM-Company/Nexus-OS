name: Windows desktop

on:
  pull_request:
    paths:
      - "desktop/windows/**"
      - "apps/web/**"
      - ".github/workflows/windows-desktop.yml"
      - ".github/workflows/windows-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate desktop syntax
        shell: pwsh
        run: |
          node --check desktop/windows/main.cjs
          node --check desktop/windows/preload.cjs
          node --check desktop/windows/connection-policy.cjs
          node --check desktop/windows/connection-state.cjs
          node --check desktop/windows/credential-store.cjs
          node --check desktop/windows/support-bundle.cjs
          node --check desktop/windows/update-policy.cjs
          node --check desktop/windows/release-chain.cjs
          node --check desktop/windows/signing-policy.cjs
          node --check desktop/windows/smoke-mode.cjs
          node --check desktop/windows/connection.js
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "desktop/windows/scripts/installer-lifecycle.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List -Force
            throw "installer-lifecycle.ps1 contains PowerShell syntax errors."
          }

      - name: Test desktop policy
        run: node --test desktop/windows/test/*.test.cjs

      - name: Build Windows installer
        working-directory: desktop/windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        shell: pwsh
        run: |
          npx --yes electron-builder@26.17.0 --win nsis --x64 --publish never 2>&1 |
            Tee-Object -FilePath electron-builder.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (Select-String -Path electron-builder.log -SimpleMatch "default Electron icon is used") {
            throw "Windows build fell back to the default Electron icon."
          }

      - name: Verify installed Windows shell lifecycle
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/windows/package.json').version"
          $installer = "desktop/windows/dist/Cosmora-Setup-$version-x64.exe"
          ./desktop/windows/scripts/installer-lifecycle.ps1 `
            -InstallerPath $installer `
            -Version $version `
            -InstallPrefix "cosmora-installed"

      - name: Build and verify release bundle
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/windows/package.json').version"
          $installer = "desktop/windows/dist/Cosmora-Setup-$version-x64.exe"
          node desktop/windows/release-chain.cjs bundle --installer $installer --package desktop/windows/package.json --output desktop/windows/dist/release --git-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          node desktop/windows/release-chain.cjs verify --installer $installer --metadata desktop/windows/dist/release/release-metadata.json

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cosmora-windows-x64
          path: |
            desktop/windows/dist/Cosmora-Setup-*.exe
            desktop/windows/dist/Cosmora-Setup-*.exe.blockmap
            desktop/windows/dist/release/release-metadata.json
            desktop/windows/dist/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
