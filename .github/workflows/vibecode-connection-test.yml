name: Model provider connection check

on:
  workflow_dispatch:
    inputs:
      live_trial:
        description: Send one generation request (8 output tokens); requires execution stop cleared
        type: boolean
        required: false
        default: false
  push:
    branches:
      - feat/b0-2-model-registry-router
    paths:
      - .github/workflows/vibecode-connection-test.yml
      - scripts/provider-connection-check.mjs

permissions:
  contents: read

concurrency:
  group: vibecode-connection-test
  cancel-in-progress: true

jobs:
  verify:
    name: Check provider access and model catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
      MODEL_PROVIDER_ID: ${{ vars.MODEL_PROVIDER_ID }}
      MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL }}
      MODEL_NAME: ${{ vars.MODEL_NAME }}
      MODEL_FALLBACK_TO_MOCK: ${{ vars.MODEL_FALLBACK_TO_MOCK }}
      MODEL_MAX_ATTEMPTS_PER_ROUTE: ${{ vars.MODEL_MAX_ATTEMPTS_PER_ROUTE }}
      RUNTIME_EMERGENCY_STOP: ${{ vars.RUNTIME_EMERGENCY_STOP }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      COSMORA_ALLOW_PAID_CONNECTION_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.live_trial == true && 'SEND_ONE_BOUNDED_REQUEST' || '' }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check connection (discovery by default; no retries)
        run: node scripts/provider-connection-check.mjs
