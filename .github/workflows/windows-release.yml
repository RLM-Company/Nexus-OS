name: Windows signed release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact desktop version to release (for example 0.7.0)"
        required: true
        type: string
      release_page_url:
        description: "HTTPS release page URL"
        required: true
        type: string
      download_url:
        description: "Final HTTPS EXE download URL"
        required: true
        type: string
      published_at:
        description: "Release timestamp in ISO 8601 format"
        required: true
        type: string
      confirm:
        description: "Type SIGNED_RELEASE to authorize release signing"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-signed-release
  cancel-in-progress: false

jobs:
  signed-release:
    name: Build signed Windows release
    runs-on: windows-latest
    timeout-minutes: 25
    environment: windows-release

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Require explicit signed-release confirmation
        shell: pwsh
        env:
          RELEASE_CONFIRM: ${{ inputs.confirm }}
        run: |
          if ($env:RELEASE_CONFIRM -ne "SIGNED_RELEASE") {
            throw "Release signing requires confirm=SIGNED_RELEASE."
          }

      - name: Validate requested release version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $packageVersion = node -p "require('./desktop/windows/package.json').version"
          if ($packageVersion -ne $env:REQUESTED_VERSION) {
            throw "Requested version $($env:REQUESTED_VERSION) does not match package version $packageVersion."
          }

      - name: Validate desktop syntax
        shell: pwsh
        run: |
          node --check desktop/windows/main.cjs
          node --check desktop/windows/preload.cjs
          node --check desktop/windows/connection-policy.cjs
          node --check desktop/windows/connection-state.cjs
          node --check desktop/windows/credential-store.cjs
          node --check desktop/windows/support-bundle.cjs
          node --check desktop/windows/update-policy.cjs
          node --check desktop/windows/release-chain.cjs
          node --check desktop/windows/signing-policy.cjs
          node --check desktop/windows/smoke-mode.cjs
          node --check desktop/windows/connection.js

      - name: Test desktop policy
        run: node --test desktop/windows/test/*.test.cjs

      - name: Require signing credentials and signer pins
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          EXPECTED_THUMBPRINT: ${{ secrets.WINDOWS_CSC_EXPECTED_THUMBPRINT }}
          EXPECTED_SUBJECT: ${{ secrets.WINDOWS_CSC_EXPECTED_SUBJECT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            throw "windows-release environment secret WINDOWS_CSC_LINK is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw "windows-release environment secret WINDOWS_CSC_KEY_PASSWORD is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_THUMBPRINT)) {
            throw "windows-release environment secret WINDOWS_CSC_EXPECTED_THUMBPRINT is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_SUBJECT)) {
            throw "windows-release environment secret WINDOWS_CSC_EXPECTED_SUBJECT is not configured."
          }

      - name: Build signed Windows installer
        working-directory: desktop/windows
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npx --yes electron-builder@26.17.0 --win nsis --x64 --publish never

      - name: Verify pinned Authenticode signature
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          EXPECTED_THUMBPRINT: ${{ secrets.WINDOWS_CSC_EXPECTED_THUMBPRINT }}
          EXPECTED_SUBJECT: ${{ secrets.WINDOWS_CSC_EXPECTED_SUBJECT }}
        run: |
          function Get-EkuOids([System.Security.Cryptography.X509Certificates.X509Certificate2]$Certificate) {
            $extension = $Certificate.Extensions |
              Where-Object { $_.Oid.Value -eq "2.5.29.37" } |
              Select-Object -First 1
            if (-not $extension) {
              return @()
            }
            $eku = [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new(
              $extension,
              $false
            )
            return @($eku.EnhancedKeyUsages | ForEach-Object { $_.Value })
          }

          $installer = "desktop/windows/dist/Cosmora-Setup-$($env:REQUESTED_VERSION)-x64.exe"
          if (-not (Test-Path $installer)) {
            throw "Signed installer was not produced at $installer."
          }

          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne "Valid") {
            throw "Authenticode verification failed with status $($signature.Status)."
          }
          if (-not $signature.SignerCertificate) {
            throw "Authenticode signature has no signer certificate."
          }
          if (-not $signature.TimeStamperCertificate) {
            throw "Authenticode signature has no timestamp certificate."
          }

          New-Item -ItemType Directory -Path "desktop/windows/dist/release" -Force | Out-Null
          $evidence = [ordered]@{
            status = [string]$signature.Status
            signerSubject = $signature.SignerCertificate.Subject
            signerThumbprint = $signature.SignerCertificate.Thumbprint
            signerNotBefore = $signature.SignerCertificate.NotBefore.ToUniversalTime().ToString("o")
            signerNotAfter = $signature.SignerCertificate.NotAfter.ToUniversalTime().ToString("o")
            signerEkus = @(Get-EkuOids $signature.SignerCertificate)
            timestampSubject = $signature.TimeStamperCertificate.Subject
            timestampThumbprint = $signature.TimeStamperCertificate.Thumbprint
            timestampNotBefore = $signature.TimeStamperCertificate.NotBefore.ToUniversalTime().ToString("o")
            timestampNotAfter = $signature.TimeStamperCertificate.NotAfter.ToUniversalTime().ToString("o")
            timestampEkus = @(Get-EkuOids $signature.TimeStamperCertificate)
            verifiedAt = (Get-Date).ToUniversalTime().ToString("o")
          }
          $evidence |
            ConvertTo-Json -Depth 5 |
            Set-Content -Path "desktop/windows/dist/release/signature-evidence.json" -Encoding utf8

          node desktop/windows/signing-policy.cjs `
            --evidence desktop/windows/dist/release/signature-evidence.json `
            --installer $installer `
            --output desktop/windows/dist/release/signature-metadata.json `
            --expected-thumbprint "$env:EXPECTED_THUMBPRINT" `
            --expected-subject "$env:EXPECTED_SUBJECT"

          Remove-Item "desktop/windows/dist/release/signature-evidence.json" -Force

      - name: Smoke test installed signed NSIS lifecycle
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = (Resolve-Path "desktop/windows/dist/Cosmora-Setup-$($env:REQUESTED_VERSION)-x64.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "cosmora-signed-installed-$($env:REQUESTED_VERSION)"
          $marker = Join-Path $env:TEMP "cosmora-smoke-signed-$($env:REQUESTED_VERSION).json"

          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $marker -Force -ErrorAction SilentlyContinue

          $install = Start-Process -FilePath $installer -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Signed NSIS install failed with exit code $($install.ExitCode)."
          }

          $app = Join-Path $installDir "Cosmora.exe"
          if (-not (Test-Path $app -PathType Leaf)) {
            throw "Installed signed Cosmora.exe was not found at $app."
          }

          $uninstaller = Get-ChildItem -Path $installDir -Filter "Uninstall*.exe" -File |
            Select-Object -First 1
          if (-not $uninstaller) {
            throw "Signed NSIS uninstaller was not found in $installDir."
          }

          $env:COSMORA_SMOKE_OUTPUT = $marker
          try {
            $smokeProcess = Start-Process -FilePath $app -ArgumentList "--cosmora-smoke-test" -Wait -PassThru
          } finally {
            Remove-Item Env:COSMORA_SMOKE_OUTPUT -ErrorAction SilentlyContinue
          }
          if ($smokeProcess.ExitCode -ne 0) {
            throw "Installed signed Cosmora smoke process failed with exit code $($smokeProcess.ExitCode)."
          }

          $record = Get-Content $marker -Raw | ConvertFrom-Json
          if (
            $record.schemaVersion -ne 1 -or
            $record.version -ne $env:REQUESTED_VERSION -or
            $record.isPackaged -ne $true -or
            $record.platform -ne "win32" -or
            $record.arch -ne "x64"
          ) {
            throw "Installed signed Cosmora reported unexpected smoke metadata."
          }

          $expectedExe = [IO.Path]::GetFullPath($app)
          $actualExe = [IO.Path]::GetFullPath([string]$record.execPath)
          if (-not [string]::Equals($expectedExe, $actualExe, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Signed smoke executable path does not match the installed application."
          }

          $expectedResources = [IO.Path]::GetFullPath((Join-Path $installDir "resources"))
          $actualResources = [IO.Path]::GetFullPath([string]$record.resourcesPath)
          if (-not [string]::Equals($expectedResources, $actualResources, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Signed smoke resources path does not match the installed application."
          }

          $expectedAsar = [IO.Path]::GetFullPath((Join-Path $expectedResources "app.asar"))
          $actualAppPath = [IO.Path]::GetFullPath([string]$record.appPath)
          if (-not [string]::Equals($expectedAsar, $actualAppPath, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Signed smoke app path is not the packaged app.asar."
          }

          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Signed NSIS uninstall failed with exit code $($uninstall.ExitCode)."
          }

          for ($attempt = 0; $attempt -lt 80 -and (Test-Path $installDir); $attempt++) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path $installDir) {
            throw "Signed NSIS uninstall left the installation directory behind."
          }

          Remove-Item $marker -Force -ErrorAction SilentlyContinue

      - name: Build signed release bundle
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_PAGE_URL: ${{ inputs.release_page_url }}
          DOWNLOAD_URL: ${{ inputs.download_url }}
          PUBLISHED_AT: ${{ inputs.published_at }}
        run: |
          $installer = "desktop/windows/dist/Cosmora-Setup-$($env:REQUESTED_VERSION)-x64.exe"
          node desktop/windows/release-chain.cjs bundle --installer $installer --package desktop/windows/package.json --output desktop/windows/dist/release --git-sha "${{ github.sha }}"
          node desktop/windows/release-chain.cjs manifest --metadata desktop/windows/dist/release/release-metadata.json --release-page-url "$env:RELEASE_PAGE_URL" --download-url "$env:DOWNLOAD_URL" --published-at "$env:PUBLISHED_AT" --output desktop/windows/dist/release/update-manifest.json
          node desktop/windows/release-chain.cjs verify --installer $installer --metadata desktop/windows/dist/release/release-metadata.json --manifest desktop/windows/dist/release/update-manifest.json --signature desktop/windows/dist/release/signature-metadata.json

      - name: Upload signed release bundle
        uses: actions/upload-artifact@v4
        with:
          name: cosmora-windows-signed-${{ inputs.version }}
          path: |
            desktop/windows/dist/Cosmora-Setup-${{ inputs.version }}-x64.exe
            desktop/windows/dist/Cosmora-Setup-${{ inputs.version }}-x64.exe.blockmap
            desktop/windows/dist/release/release-metadata.json
            desktop/windows/dist/release/SHA256SUMS.txt
            desktop/windows/dist/release/signature-metadata.json
            desktop/windows/dist/release/update-manifest.json
          if-no-files-found: error
          retention-days: 14
