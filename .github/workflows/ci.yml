name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          TURBO_TELEMETRY_DISABLED: "1"
        run: pnpm check:core

  browser:
    name: Browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @cosmora/web exec playwright install --with-deps chromium

      - name: Run all browser scenarios with local fixtures
        env:
          KOSMORA_E2E_PRODUCTION: "1"
          NEXT_TELEMETRY_DISABLED: "1"
          TURBO_TELEMETRY_DISABLED: "1"
        run: pnpm test:e2e

      - name: Verify Koswork browser CDP engine and native-window UI assets
        env:
          KOSWORK_BROWSER_SCREENSHOT: ${{ runner.temp }}/koswork-browser-home.png
        run: node desktop/windows/ci/browser-dom-smoke.cjs

      - name: Preserve Koswork browser preview
        uses: actions/upload-artifact@v4
        with:
          name: koswork-browser-preview
          path: ${{ runner.temp }}/koswork-browser-home.png
          if-no-files-found: error
          retention-days: 7

      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: apps/web/test-results/
          retention-days: 7

  code-sandbox:
    name: Code sandbox isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Provision only on the disposable CI host. The runtime itself never pulls
      # images and receives the immutable local image ID, not a mutable tag.
      - name: Provision official Node test image and pin its local content ID
        shell: bash
        run: |
          docker pull node:24-bookworm-slim
          image_id=$(docker image inspect --format '{{.Id}}' node:24-bookworm-slim)
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          # Provision the cold Docker/Node layers before the timed integration
          # cases. Their 5s runtime limit and all isolation assertions stay intact.
          warmup_name="kosmora-ci-warmup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$warmup_name" >/dev/null 2>&1 || true' EXIT
          timeout --signal=TERM --kill-after=5s 30s docker run --rm --pull=never \
            --name "$warmup_name" --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --user=65534:65534 \
            "$image_id" node -e "require('node:test')('provisioning warm-up', () => {});"
          echo "CODE_AGENT_TEST_IMAGE=$image_id" >> "$GITHUB_ENV"

      - name: Verify real OCI execution, isolation and descendant cleanup
        env:
          CODE_AGENT_TEST_RUNTIME: docker
        run: pnpm --filter @cosmora/tool-runtime exec vitest run test/code-agent-workspace.oci.test.ts --maxWorkers=1
