name: Temporary media formatting and type diagnostics
on:
  push:
    branches: ["ops/free-studio-media"]
permissions:
  contents: read
jobs:
  media-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format media files and print exact fixture copies
        shell: bash
        run: |
          pnpm exec prettier --write \
            apps/web/src/app/media-generation/media-image-options.ts \
            apps/web/src/app/media-generation/media-image-options.test.ts \
            apps/web/src/app/media-generation/media-panel.tsx \
            apps/web/src/app/media-generation/media-workbench.tsx
          for p in \
            apps/web/src/app/media-generation/media-image-options.ts \
            apps/web/src/app/media-generation/media-image-options.test.ts \
            apps/web/src/app/media-generation/media-panel.tsx \
            apps/web/src/app/media-generation/media-workbench.tsx; do
            printf '__MEDIA_FMT_BEGIN__%s__' "$p"
            base64 -w0 "$p"
            printf '__MEDIA_FMT_END__\\n'
          done
      - name: Focused web typecheck
        run: pnpm --filter @cosmora/web typecheck
