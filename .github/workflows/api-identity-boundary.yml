name: API identity boundary

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/contracts/**"
      - "packages/db/**"
      - ".github/workflows/api-identity-boundary.yml"

permissions:
  contents: read

jobs:
  identity-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck API
        run: pnpm --filter @cosmora/api typecheck
      - name: Test identity and moderation API
        run: pnpm --filter @cosmora/api exec vitest run test/identity-boundary.test.ts
