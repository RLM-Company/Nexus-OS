name: VibeCode tool-calling recovery probe

on:
  workflow_dispatch:
  push:
    branches:
      - feat/b0-2-vibecode-capability-probe
    paths:
      - .github/workflows/vibecode-capability-probe.yml

permissions:
  contents: read

concurrency:
  group: vibecode-capability-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Probe tool calling once
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
      MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL }}
      MODEL_NAME: ${{ vars.MODEL_NAME }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in MODEL_PROVIDER MODEL_BASE_URL MODEL_NAME MODEL_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::${name} is not configured"
              missing=1
            fi
          done
          [[ "${missing}" -eq 0 ]]
          case "${MODEL_PROVIDER}" in
            openai-compatible | anthropic-compatible) ;;
            *)
              echo "::error::MODEL_PROVIDER must be openai-compatible or anthropic-compatible"
              exit 1
              ;;
          esac

      - name: Run the one remaining authorized request
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT

          schema='{"type":"object","properties":{"ok":{"type":"boolean"}},"required":["ok"],"additionalProperties":false}'

          if [[ "${MODEL_PROVIDER}" == "anthropic-compatible" ]]; then
            endpoint="${MODEL_BASE_URL%/}/messages"
            headers=(
              --header "x-api-key: ${MODEL_API_KEY}"
              --header "anthropic-version: 2023-06-01"
              --header "Content-Type: application/json"
            )
            payload="$(jq -nc --arg model "${MODEL_NAME}" --argjson schema "${schema}" '{
              model: $model,
              messages: [{role: "user", content: "Reply only with the word OK. Do not call any tool."}],
              max_tokens: 32,
              tools: [{
                name: "record_probe",
                description: "Record the capability probe result.",
                strict: true,
                input_schema: $schema
              }],
              tool_choice: {type: "tool", name: "record_probe"}
            }')"
          else
            endpoint="${MODEL_BASE_URL%/}/chat/completions"
            headers=(
              --header "Authorization: Bearer ${MODEL_API_KEY}"
              --header "Content-Type: application/json"
            )
            payload="$(jq -nc --arg model "${MODEL_NAME}" --argjson schema "${schema}" '{
              model: $model,
              messages: [{role: "user", content: "Reply only with the word OK. Do not call any tool."}],
              max_tokens: 32,
              tools: [{
                type: "function",
                function: {
                  name: "record_probe",
                  description: "Record the capability probe result.",
                  strict: true,
                  parameters: $schema
                }
              }],
              tool_choice: {type: "function", function: {name: "record_probe"}}
            }')"
          fi

          set +e
          http_status="$(curl --silent --show-error \
            --max-time 45 \
            --output "${response_file}" \
            --write-out "%{http_code}" \
            --request POST "${endpoint}" \
            "${headers[@]}" \
            --data "${payload}")"
          curl_status=$?
          set -e

          probe_status=1
          if [[ "${curl_status}" -ne 0 ]]; then
            echo "::error::tool_calling probe transport failed"
          elif [[ "${http_status}" != "200" ]]; then
            detail="$(jq -r '.error.message // .message // "Provider rejected the probe"' "${response_file}" 2>/dev/null || printf '%s' 'Unreadable error response')"
            safe_detail="$(printf '%s' "${detail}" | tr '\n\r' '  ' | sed -E 's/vk-[[:alnum:]_.-]+/[REDACTED]/g' | cut -c1-500)"
            echo "::error::tool_calling probe returned HTTP ${http_status}: ${safe_detail}"
          elif [[ "${MODEL_PROVIDER}" == "anthropic-compatible" ]] &&
            jq -e 'any(.content[]?; .type == "tool_use" and .name == "record_probe" and .input.ok == true)' "${response_file}" >/dev/null; then
            probe_status=0
          elif [[ "${MODEL_PROVIDER}" == "openai-compatible" ]] &&
            jq -e 'any(.choices[0].message.tool_calls[]?; .function.name == "record_probe" and ((.function.arguments | fromjson | .ok) == true))' "${response_file}" >/dev/null; then
            probe_status=0
          else
            echo "::error::tool_calling probe response did not satisfy the required contract"
          fi

          {
            echo "## VibeCode tool-calling recovery probe"
            echo
            echo "- Model: \`${MODEL_NAME}\`"
            echo "- Protocol: \`${MODEL_PROVIDER}\`"
            if [[ "${probe_status}" -eq 0 ]]; then
              echo "- Tool calling: PASS"
            else
              echo "- Tool calling: FAIL"
            fi
            echo "- Provider requests made in this run: 1"
            echo "- Customer/project content sent: none"
          } >> "${GITHUB_STEP_SUMMARY}"

          [[ "${probe_status}" -eq 0 ]]
