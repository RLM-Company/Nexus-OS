name: Temporary graph format

on:
  push:
    branches:
      - codex/intelligence-graph-workspace-20261009

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format graph files
        run: pnpm exec prettier --write packages/core/src/intelligence-graph-workspace.ts packages/core/test/intelligence-graph-workspace.test.ts packages/db/src/intelligence-graph-workspace-store.ts packages/contracts/src/intelligence-graph-workspace.ts apps/api/src/intelligence-graph-workspace-routes.ts apps/api/src/app.ts apps/web/src/app/graph-workspace/page.tsx docs/handoff/INTELLIGENCE_GRAPH_WORKSPACE_2026-10-09.md
      - name: Commit formatting only
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/intelligence-graph-workspace.ts packages/core/test/intelligence-graph-workspace.test.ts packages/db/src/intelligence-graph-workspace-store.ts packages/contracts/src/intelligence-graph-workspace.ts apps/api/src/intelligence-graph-workspace-routes.ts apps/api/src/app.ts apps/web/src/app/graph-workspace/page.tsx docs/handoff/INTELLIGENCE_GRAPH_WORKSPACE_2026-10-09.md
          git commit -m "style(graph): format workspace slice"
          git push origin "HEAD:${GITHUB_REF_NAME}"
