name: Temporary graph format

on:
  push:
    branches:
      - codex/intelligence-graph-real-knowledge-20260929

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format model reliability graph
        run: pnpm exec prettier --write packages/core/test/fixtures/cosmora-model-reliability-graph.ts

      - name: Commit formatting only
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/test/fixtures/cosmora-model-reliability-graph.ts
          git commit -m "style(graph): format model reliability graph"
          git push origin "HEAD:${GITHUB_REF_NAME}"
