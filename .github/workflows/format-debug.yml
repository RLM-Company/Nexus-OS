name: Format Debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier diff
        run: |
          pnpm exec prettier --write \
            apps/web/e2e/agent-studio.spec.ts \
            apps/web/src/app/agent-studio/blueprint-controls.tsx
          git diff -- \
            apps/web/e2e/agent-studio.spec.ts \
            apps/web/src/app/agent-studio/blueprint-controls.tsx
          test -z "$(git status --short -- apps/web/e2e/agent-studio.spec.ts apps/web/src/app/agent-studio/blueprint-controls.tsx)"
