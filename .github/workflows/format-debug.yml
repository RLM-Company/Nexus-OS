name: Format Debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier diff
        run: |
          pnpm exec prettier --write packages/contracts/src/manager-runtime-context-validation.ts
          git diff -- packages/contracts/src/manager-runtime-context-validation.ts
          test -z "$(git status --short -- packages/contracts/src/manager-runtime-context-validation.ts)"
