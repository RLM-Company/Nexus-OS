name: Format Debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier diff
        run: |
          pnpm exec prettier --write \
            packages/contracts/src/manager-runtime-scenario-validation.ts \
            packages/contracts/src/manager-runtime-scenarios.ts \
            packages/contracts/src/manager-runtime-state.ts \
            packages/contracts/src/manager-runtime.ts \
            packages/contracts/test/manager-runtime.test.ts \
            packages/contracts/test/manager-runtime-state.test.ts \
            docs/constitution/contracts/manager-runtime-contract-v1.md
          git diff -- \
            packages/contracts/src/manager-runtime-scenario-validation.ts \
            packages/contracts/src/manager-runtime-scenarios.ts \
            packages/contracts/src/manager-runtime-state.ts \
            packages/contracts/src/manager-runtime.ts \
            packages/contracts/test/manager-runtime.test.ts \
            packages/contracts/test/manager-runtime-state.test.ts \
            docs/constitution/contracts/manager-runtime-contract-v1.md
          test -z "$(git status --short -- packages/contracts/src/manager-runtime-scenario-validation.ts packages/contracts/src/manager-runtime-scenarios.ts packages/contracts/src/manager-runtime-state.ts packages/contracts/src/manager-runtime.ts packages/contracts/test/manager-runtime.test.ts packages/contracts/test/manager-runtime-state.test.ts docs/constitution/contracts/manager-runtime-contract-v1.md)"
